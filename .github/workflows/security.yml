name: Build and security scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build image
        run: docker build --tag secbox:ci ./toolbox
      - name: Check installed tools
        run: docker run --rm --read-only --cap-drop ALL --tmpfs /tmp secbox:ci secbox-check
      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: secbox:ci
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true
